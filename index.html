function formatTime(t){return `${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;}
function pause(){if(state!=='play'&&state!=='rewind')return;paused=!paused;keys.clear();mouse.left=mouse.right=false;if(paused){show('<span class="eyebrow">Ночь подождёт</span><h2>Тихо. Пауза.</h2><p>'+bindingLabel('pause')+' — продолжить · '+bindingLabel('restart')+' — обе фазы заново</p><div class="actions"><button id="resume">Продолжить</button><button class="secondary" id="menu">В меню</button></div>');document.getElementById('resume').onclick=pause;document.getElementById('menu').onclick=title;}else panel.classList.add('hidden');}
function audioStart(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();master=audio.createGain();master.gain.value=settings.volume;synthBus=audio.createGain();let limiter=audio.createDynamicsCompressor();limiter.threshold.value=-16;limiter.knee.value=16;limiter.ratio.value=12;limiter.attack.value=.003;limiter.release.value=.18;synthBus.connect(limiter);limiter.connect(master);master.connect(audio.destination);}if(audio.state==='suspended')audio.resume().catch(()=>{});}
function press(code,repeat=false){if(state!=='play'&&state!=='rewind')return;keys.add(code);if(!repeat&&matches('pause',code)){pause();return;}if(!repeat&&matches('restart',code)){restart();return;}if(state!=='play'||paused||repeat)return;let a=axis(),p=phase===1?spider:human;if(phase===1&&matches('dash',code))dash(p,a.x||(!a.y?Math.cos(p.angle):0),a.y||(!a.x?Math.sin(p.angle):0));if(phase===2&&matches('step',code))dash(p,a.x||Math.cos(p.angle+Math.PI/2),a.y||Math.sin(p.angle+Math.PI/2));if(phase===2&&matches('clear',code)){human.slow=Math.max(0,human.slow-.48);sound('clear');}}
document.addEventListener('keydown',e=>{audioStart();if(bindingCapture){e.preventDefault();if(e.code==='Escape'){bindingCapture=null;settingsScreen();}else captureBinding(e.code);return;}if(state!=='play'&&state!=='rewind')return;if(Object.values(settings.bindings).some(b=>b.includes(e.code)))e.preventDefault();press(e.code,e.repeat);});
document.addEventListener('click',e=>{if(suppressBindingClick){suppressBindingClick=false;e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('keyup',e=>keys.delete(e.code));canvas.addEventListener('mousemove',aimPointer);canvas.addEventListener('mouseenter',()=>{mouse.rawX=undefined;});canvas.addEventListener('mousedown',e=>{audioStart();press('Mouse'+e.button);});document.addEventListener('mouseup',e=>{keys.delete('Mouse'+e.button);});document.addEventListener('mousedown',e=>{audioStart();if(bindingCapture){e.preventDefault();e.stopPropagation();suppressBindingClick=e.button===0;captureBinding('Mouse'+e.button);}},true);document.addEventListener('contextmenu',e=>{if(e.target===canvas||state==='settings')e.preventDefault();});let lastHover=null;document.addEventListener('pointerover',e=>{let b=e.target.closest('button');if(b&&b!==lastHover){lastHover=b;sound('hover');}});document.addEventListener('click',e=>{if(e.target.closest('button')){audioStart();sound('ui');}});window.addEventListener('blur',()=>{keys.clear();mouse.left=mouse.right=false;if((state==='play'||state==='rewind')&&!paused)pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='rewind')&&!paused)pause();});document.addEventListener('click',audioStart);
function frame(t){let dt=Math.min(.033,Math.max(0,(t-last)/1000));last=t;update(dt);updateCamera(dt);render();requestAnimationFrame(frame);}
startPhase(1);requestAnimationFrame(frame);
function title(){clock=0;state='title';paused=false;bindingCapture=null;keys.clear();mouse.left=mouse.right=false;show('<span class="eyebrow">03:47 / Sharrowkin jam</span><h1>КТО <span class="red">КОГО</span></h1><p>Ты не планировал умирать сегодня.<br>Ни один из вас.</p><nav class="menu-actions" aria-label="Главное меню"><button id="begin">Начать игру</button><button class="secondary" id="settings">Настройки</button><button class="secondary" id="credits">Разработчики</button></nav><span class="fine">ОДНА КВАРТИРА · ДВЕ СУДЬБЫ · ТРИ УДАРА</span>');panel.classList.add('intro');document.getElementById('begin').onclick=howto;document.getElementById('settings').onclick=settingsScreen;document.getElementById('credits').onclick=credits;}
function settingsScreen(){state='settings';show('<span class="eyebrow">Ночь под контролем</span><h2>Настройки</h2><div class="settings"><div class="setting"><label for="sensitivity">Чувствительность наведения</label><output id="sensitivity-value">'+settings.sensitivity.toFixed(2)+'×</output><input id="sensitivity" type="range" min="0.5" max="2" step="0.05" value="'+settings.sensitivity+'"></div><div class="setting"><label for="volume">Общая громкость</label><output id="volume-value">'+Math.round(settings.volume*100)+'%</output><input id="volume" type="range" min="0" max="1" step="0.01" value="'+settings.volume+'"></div><p class="settings-note">Чувствительность прицела: 1× — обычный курсор. Ходьба без изменений.</p><div class="bind-grid">'+Object.keys(actionNames).map(a=>'<div class="bind-row"><span>'+actionNames[a]+'</span><button class="secondary" id="bind-'+a+'" aria-label="Переназначить: '+actionNames[a]+'">'+(bindingCapture===a?'Нажмите…':bindingLabel(a))+'</button></div>').join('')+'</div><p class="settings-note" id="bind-message" role="status">'+(bindingCapture?'Нажмите клавишу или кнопку мыши. Esc — отменить.':'Нажмите на назначение, затем на нужную кнопку.')+'</p></div><div class="actions"><button id="back">В меню</button><button class="secondary" id="defaults">Сбросить настройки</button></div>');document.getElementById('sensitivity').oninput=e=>{settings.sensitivity=Number(e.target.value);document.getElementById('sensitivity-value').textContent=settings.sensitivity.toFixed(2)+'×';};document.getElementById('volume').oninput=e=>{settings.volume=Number(e.target.value);document.getElementById('volume-value').textContent=Math.round(settings.volume*100)+'%';applyVolume();};document.getElementById('volume').onchange=()=>sound('confirm');for(const a of Object.keys(actionNames))document.getElementById('bind-'+a).onclick=()=>{bindingCapture=a;settingsScreen();};document.getElementById('back').onclick=title;document.getElementById('defaults').onclick=()=>{settings={sensitivity:1,volume:.48,bindings:JSON.parse(JSON.stringify(defaultBindings))};bindingCapture=null;applyVolume();settingsScreen();};}
function credits(){state='credits';show('<span class="eyebrow">Люди за вентиляцией</span><h2>Разработчики</h2><p class="credit">Build by GPT 6.1 Sol.</p><button id="back">В меню</button>');document.getElementById('back').onclick=title;}
function inputHints(){return phase===1?bindingLabel('up')+' / '+bindingLabel('left')+' / '+bindingLabel('down')+' / '+bindingLabel('right')+'  ползти     '+bindingLabel('dash')+'  рывок     '+bindingLabel('web')+'  паутина     '+bindingLabel('bite')+'  укус':bindingLabel('up')+' / '+bindingLabel('left')+' / '+bindingLabel('down')+' / '+bindingLabel('right')+'  идти     '+bindingLabel('slap')+'  тапок     '+bindingLabel('light')+'  свет     '+bindingLabel('step')+'  шаг     '+bindingLabel('clear')+'  сброс';}
function howto(){state='howto';show('<span class="eyebrow">Кто кого — решать вам</span><h2>Сначала восемь ног. Потом две.</h2><div class="columns"><section><h3>01 / ПАУК</h3><p>'+bindingLabel('up')+' / '+bindingLabel('left')+' / '+bindingLabel('down')+' / '+bindingLabel('right')+' — ползти; '+bindingLabel('dash')+' — рывок.</p><p>'+bindingLabel('web')+' — паутина; держи '+bindingLabel('bite')+' вплотную 0,8 с.</p><p>Три укуса — победа. Три тапка — некролог.</p></section><section><h3>02 / ЧЕЛОВЕК</h3><p>'+bindingLabel('up')+' / '+bindingLabel('left')+' / '+bindingLabel('down')+' / '+bindingLabel('right')+' — идти; '+bindingLabel('slap')+' — тапок.</p><p>Держи '+bindingLabel('light')+' — свет; '+bindingLabel('step')+' — шаг.</p><p>Жми '+bindingLabel('clear')+' от паутины. Три попадания — победа.</p></section></div><button id="go">В квартиру</button><p class="fine">'+bindingLabel('pause')+' — ПАУЗА · '+bindingLabel('restart')+' — ОБЕ ФАЗЫ ЗАНОВО</p>');document.getElementById('go').onclick=restart;}
function winner(a,b){return a.win!==b.win?(a.win?0:1):a.lives!==b.lives?(a.lives>b.lives?0:1):Math.abs(a.time-b.time)>.01?(a.time<b.time?0:1):-1;}
function verdict(){let [a,b]=results,w=winner(a,b);show('<span class="eyebrow">04:00 / протокол ночного происшествия</span><h2>Кто кого?</h2><div class="columns">'+results.map((r,i)=>'<section class="stats"><h3>'+(i?'ЧЕЛОВЕК':'ПАУК')+'</h3><strong>'+(r.win?'ВЫЖИЛ':'НЕ ДОЖИЛ')+'</strong><dl><dt>'+(i?'Попадания':'Укусы')+'</dt><dd>'+r.hits+' / 3</dd><dt>Жизни</dt><dd>'+r.lives+' / 3</dd><dt>Время</dt><dd>'+formatTime(r.time)+'</dd><dt>Победы</dt><dd>'+(r.win?1:0)+'</dd></dl></section>').join('')+'</div><p>'+(w===0?'Паук взял кухню. Ипотеку пусть платит человек.':w===1?'Человек победил. Тапок принят на работу.':'Ничья. Кухня досталась тараканам.')+'</p><button id="again">Ещё раз</button><p class="fine">ПОБЕДЫ → ОСТАВШИЕСЯ ЖИЗНИ → МЕНЬШЕЕ ВРЕМЯ</p>');document.getElementById('again').onclick=restart;}
title();
</script></body></html>
